[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanotracker"
version = "0.1.0"
description = "NanoTrack V3 object tracking library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "PyYAML>=6.0",
]

[project.scripts]
nanotracker-demo = "nanotracker.track_video:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nanotracker"]

[tool.hatch.build.targets.wheel.force-include]
"models/nanotrackv3_rknn_rk3566" = "nanotracker/models/nanotrackv3_rknn_rk3566"

